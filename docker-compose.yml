services:
  key-init:
    image: alpine
    restart: no

    volumes:
      - security-private:/keys/security-private
      - security-public:/keys/security-public
      - backend-private:/keys/backend-private
      - backend-public:/keys/backend-public
      - ai-core-private:/keys/ai-core-private
      - ai-core-public:/keys/ai-core-public

      - nginx-ca:/keys/nginx-ca
      - nginx-cert:/keys/nginx-cert

    command:
      - /bin/sh
      - -c
      - |
        set -eu

        apk add --no-cache openssl

        for name in security backend ai-core; do
          priv=/keys/$${name}-private/private.pem
          pub=/keys/$${name}-public/public.pem

          [ -f "$$priv" ] || openssl genpkey \
            -algorithm Ed25519 \
            -out "$$priv"

          [ -f "$$pub" ] || openssl pkey \
            -in "$$priv" \
            -pubout \
            -out "$$pub"

          chmod 600 "$$priv"
          chmod 644 "$$pub"
        done

        CA_KEY=/keys/nginx-ca/ca.key
        CA_CERT=/keys/nginx-ca/ca.crt

        if [ ! -f "$$CA_KEY" ]; then
          openssl genrsa \
            -out "$$CA_KEY" \
            4096
        fi

        if [ ! -f "$$CA_CERT" ]; then
          openssl req \
            -x509 \
            -new \
            -sha256 \
            -days 3650 \
            -key "$$CA_KEY" \
            -out "$$CA_CERT" \
            -subj "/CN=Leafy AI Local CA/O=Basilix"
        fi

        cat > /tmp/leafy-ai.ext <<'EOF'
        subjectAltName=DNS:leafy-ai.local,DNS:localhost,IP:127.0.0.1
        basicConstraints=CA:FALSE
        keyUsage=digitalSignature,keyEncipherment
        extendedKeyUsage=serverAuth
        EOF

        SERVER_KEY=/keys/nginx-cert/leafy-ai.key
        SERVER_CSR=/keys/nginx-cert/leafy-ai.csr
        SERVER_CERT=/keys/nginx-cert/leafy-ai.crt

        if [ ! -f "$$SERVER_KEY" ]; then
          openssl genrsa \
            -out "$$SERVER_KEY" \
            2048
        fi

        if [ ! -f "$$SERVER_CERT" ]; then
          openssl req \
            -new \
            -key "$$SERVER_KEY" \
            -out "$$SERVER_CSR" \
            -subj "/CN=leafy-ai.local/O=Basilix"

          openssl x509 \
            -req \
            -in "$$SERVER_CSR" \
            -CA "$$CA_CERT" \
            -CAkey "$$CA_KEY" \
            -CAcreateserial \
            -out "$$SERVER_CERT" \
            -days 825 \
            -sha256 \
            -extfile /tmp/leafy-ai.ext
        fi

        rm -f "$$SERVER_CSR"

        chmod 600 "$$CA_KEY"
        chmod 644 "$$CA_CERT"
        chmod 600 "$$SERVER_KEY"
        chmod 644 "$$SERVER_CERT"

  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: leafy-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the root .env file}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the root .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leafy_ai_db:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - leafy-network

  engine:
    build:
      context: ./leafy-ai/engine
      dockerfile: Dockerfile

    container_name: leafy-ai-engine
    restart: unless-stopped

    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME in the root .env file}
      DB_USER: ${DB_USER:?Set DB_USER in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_HOST: ${DB_HOST:?Set DB_HOST in the root .env file}
      DB_PORT: ${DB_PORT:-5432}

      AI_CORE_PUBLIC_KEY_PATH: /run/keys/ai-core/public.pem
      WEBAPP_BACKEND_PUBLIC_KEY_PATH: /run/keys/backend/public.pem
      SECURITY_PRIVATE_KEY_PATH: /run/keys/security/private.pem

      AI_CORE_URL: ${AI_CORE_URL:?Set AI_CORE_URL in the root .env file}

      GEMINI_VISION_ENABLED: ${GEMINI_VISION_ENABLED:-false}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.8-flash}
      GEMINI_VISION_THINKING_LEVEL: ${GEMINI_VISION_THINKING_LEVEL:-low}
      GEMINI_VISION_BATCH_SIZE: ${GEMINI_VISION_BATCH_SIZE:-4}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_FILE: ${GEMINI_API_KEY_FILE:-}

      CAMERA_IMAGE_DIR: /data/camera

    volumes:
      - ai-core-public:/run/keys/ai-core:ro
      - backend-public:/run/keys/backend:ro
      - security-private:/run/keys/security:ro

      - camera-images:/data/camera:rw

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    depends_on:
      key-init:
        condition: service_completed_successfully

      db:
        condition: service_healthy

    networks:
      - leafy-network

  rag-ingest:
    build:
      context: ./leafy-ai/engine
      dockerfile: Dockerfile

    restart: "no"

    working_dir: /usr/src/app

    command:
      - python
      - ingest_rag.py

    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME in the root .env file}
      DB_USER: ${DB_USER:?Set DB_USER in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      DB_HOST: db
      DB_PORT: "5432"

      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}

    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - leafy-network

  ai-core:
    build:
      context: ./leafy-ai/ai_core
      dockerfile: Dockerfile

    container_name: leafy-ai-ai-core
    restart: unless-stopped

    environment:
      SECURITY_PUBLIC_KEY_PATH: /run/keys/security/public.pem
      AI_CORE_PRIVATE_KEY_PATH: /run/keys/ai-core/private.pem

      ENGINE_URL: http://engine:8000
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}

    volumes:
      - ai-core-private:/run/keys/ai-core:ro
      - security-public:/run/keys/security:ro

    depends_on:
      key-init:
        condition: service_completed_successfully

      engine:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - leafy-network

  backend:
    build:
      context: ./webapp/backend
      dockerfile: Dockerfile

    container_name: leafy-ai-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      BACKEND_DB_NAME: leafy_ai_backend

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}

      ENGINE_URL: http://engine:8000
      ENGINE_TIMEOUT_MS: 15000

      WEBAPP_BACKEND_PRIVATE_KEY_PATH: /run/keys/backend/private.pem

      FRONTEND_ORIGINS: https://leafy-ai.local

    volumes:
      - backend-private:/run/keys/backend:ro

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      key-init:
        condition: service_completed_successfully

      db:
        condition: service_healthy

      engine:
        condition: service_healthy

    networks:
      - leafy-network

  frontend:
    build:
      context: ./webapp/frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?Set VITE_GOOGLE_CLIENT_ID in the root .env file}

    container_name: leafy-ai-frontend
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./webapp/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-cert:/etc/nginx/certs:ro

    depends_on:
      backend:
        condition: service_healthy

      key-init:
        condition: service_completed_successfully

    networks:
      - leafy-network

networks:
  leafy-network:
    driver: bridge

volumes:
  security-private:
  security-public:
  backend-private:
  backend-public:
  ai-core-private:
  ai-core-public:
  camera-images:
  leafy_ai_db:
  nginx-ca:
  nginx-cert:
