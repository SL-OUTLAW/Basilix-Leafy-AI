services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg18
    container_name: leafy-ai-timescaledb
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    environment:
      POSTGRES_DB: leafy_ai
      POSTGRES_USER: leafy_ai
      POSTGRES_PASSWORD: leafy_ai_password
    ports:
      - "5432:5432"
    volumes:
      - leafy_ai_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  leafy_ai_data:
